name: Site quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate HTML and internal links
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate HTML structure and local links
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          import re
          import sys

          root = Path.cwd().resolve()
          html_files = sorted(root.rglob("*.html"))
          errors = []

          class Validator(HTMLParser):
              def __init__(self, filename):
                  super().__init__()
                  self.filename = filename
                  self.ids = set()
                  self.links = []
                  self.h1_count = 0
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "h1":
                      self.h1_count += 1
                  if attrs.get("id"):
                      self.ids.add(attrs["id"])
                  for attr in ("href", "src"):
                      if attrs.get(attr):
                          self.links.append((attr, attrs[attr]))

          for page in html_files:
              parser = Validator(page)
              try:
                  parser.feed(page.read_text(encoding="utf-8"))
                  parser.close()
              except Exception as exc:
                  errors.append(f"{page.relative_to(root)}: HTML parse error: {exc}")
                  continue

              if parser.h1_count != 1:
                  errors.append(f"{page.relative_to(root)}: expected exactly one h1, found {parser.h1_count}")

              for attr, raw_url in parser.links:
                  parsed = urlparse(raw_url)
                  if parsed.scheme or parsed.netloc or raw_url.startswith(("mailto:", "tel:", "data:")):
                      continue
                  path_part = unquote(parsed.path)
                  fragment = parsed.fragment
                  if not path_part:
                      if fragment and fragment not in parser.ids:
                          errors.append(f"{page.relative_to(root)}: missing in-page anchor #{fragment}")
                      continue
                  target = (page.parent / path_part).resolve()
                  if not str(target).startswith(str(root)):
                      errors.append(f"{page.relative_to(root)}: link escapes site root: {raw_url}")
                  elif not target.exists():
                      errors.append(f"{page.relative_to(root)}: missing {attr} target: {raw_url}")

          sitemap = root / "sitemap.xml"
          robots = root / "robots.txt"
          if not sitemap.exists():
              errors.append("missing sitemap.xml")
          if not robots.exists():
              errors.append("missing robots.txt")
          elif "Sitemap:" not in robots.read_text(encoding="utf-8"):
              errors.append("robots.txt has no Sitemap directive")

          if errors:
              print("Site quality checks failed:")
              print("\n".join(f"- {error}" for error in errors))
              sys.exit(1)
          print(f"Validated {len(html_files)} HTML pages, their local links, sitemap.xml, and robots.txt.")
          PY
